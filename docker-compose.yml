services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      # чтобы Open WebUI и другие контейнеры могли достучаться
      - OLLAMA_HOST=0.0.0.0:11434

      # главное для твоего кейса: сколько модель держать в памяти после запроса
      # 30s = быстро освобождать VRAM/RAM; можно поставить 0 для "выгружать сразу"
      - OLLAMA_KEEP_ALIVE=30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # опционально: один раз скачать модели в volume, чтобы потом не ждать pull
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      - ollama
    restart: "no"
    volumes:
      - ollama:/root/.ollama
    environment:
      # тут OLLAMA_HOST как URL для CLI-клиента
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["sh", "-lc"]
    command: >
      ollama pull qwen2.5:14b &&
      ollama pull qwen2.5:32b-instruct || true

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - openwebui-data:/app/backend/data
    environment:
      # Open WebUI <-> Ollama
      - OLLAMA_BASE_URL=http://ollama:11434

      # если хочешь, чтобы env-переменные не "залипали" в базе после первого старта
      - ENABLE_PERSISTENT_CONFIG=False

      # твои флаги логина/регистрации
      - ENABLE_SIGNUP=true
      - ENABLE_LOGIN_FORM=true

      # желательно задать секрет (любая длинная строка)
      - WEBUI_SECRET_KEY=change-me-please
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - ollama

volumes:
  ollama:
    name: ollama-models
  openwebui-data:


