services:
  sglang:
    image: lmsysorg/sglang:latest-runtime
    container_name: sglang
    restart: unless-stopped
    expose:
      - "8000"
    shm_size: "32g"
    ipc: host
    volumes:
      - ./models:/models:ro
    environment:
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASETS_OFFLINE=1
      - PYTORCH_ALLOC_CONF=expandable_segments:True
    command:
      - python3
      - -m
      - sglang.launch_server
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - local-dev
      - --model-path
      - /models/Qwen2.5-7B-Instruct
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - openwebui-data:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://sglang:8000/v1
      - OPENAI_API_KEY=local-dev
      - ENABLE_SIGNUP=true
      - ENABLE_LOGIN_FORM=true
    depends_on:
      - sglang

volumes:
  openwebui-data:
